<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="data:,">

<body>
<!-- Inventory of the analyses of the project, docs/10-analysis/index.html. Generated from the pages of docs/10-analysis/
     whose meta type is "analysis" (so neither big-picture.html nor this index): meta author, status, progress,
     target (phase or release prepared); h1 (title), lede (question of the workstream), Date of the header; callout
     "decision" of the recommendation section; ids Q-xxx of the questions section still open (status read in
     .team/questions/, else questions.html); number of callouts "hypothesis"; first column of the impacts section.
     Generated by team/scripts/dashboard-pages.mjs; every computed part sits between the markers gen:<name> and
     /gen:<name>. Do not edit: fix the analysis page, then regenerate. Template and rules: skill deliverable-dashboard. -->
<div class="doc">
  <aside class="doc-toc">
    <div class="toc-project">PROJECT_NAME</div>
    <div class="toc-type">{{dashboard.tpl.an.type}}</div>
    <nav></nav>
    <div class="toc-back"><a href="../index.html">{{dashboard.tpl.an.back}}</a></div>
  </aside>

  <main class="doc-main wide">
    <header class="doc-header">
      <div class="kicker">{{dashboard.tpl.an.kicker}}</div>
      <h1><span class="doc-kind">{{dashboard.tpl.an.kind}}</span>: PROJECT_NAME</h1>
      <!-- gen:header -->
      <!-- /gen:header -->
    </header>

    <section class="section">
      <h2 id="workstreams">{{dashboard.tpl.an.h.workstreams}}</h2>
      <div class="info-body" hidden>
        <dl class="defs">{{dashboard.tpl.an.info.workstreams}}</dl>
      </div>
      <!-- gen:workstreams -->
      <!-- /gen:workstreams -->
    </section>
  </main>
</div>
<script src="../_assets/doc.js"></script>
</body>
</html>
