# Contrat d'API de NOM_PROJET : source de vérité entre backend et frontend, et source des pages
# endpoints et schémas de la conception détaillée (team/scripts/detaillee-pages.mjs).
# Gabarit du skill livrable-conception-detaillee, à copier dans docs/30-conception/api/. Le contenu
# d'exemple reprend le schéma d'exemple du gabarit de la conception macro (EP-01, EP-02, EN-01,
# EN-02, ressources) : il est à remplacer par celui de la conception macro du projet.
#
# Fichiers : ce fichier racine déclare info, tags, la liste des chemins et le nom de chaque composant ;
# le contenu est dans des fichiers reliés par $ref externes :
#   paths/<chemin>.yaml               un fichier par chemin (path item), toutes ses opérations ;
#                                     /ressources/{id} devient paths/ressources-id.yaml
#   components/schemas/<domaine>.yaml schémas regroupés par domaine fonctionnel ; la première ligne
#                                     « # domain: <libellé> » nomme la card du domaine, libellé
#                                     dans la langue du projet
#   components/parameters.yaml, components/responses.yaml
# Un schéma, un paramètre ou une réponse n'existe que s'il est nommé ici sous components ; ailleurs,
# on le cite par un $ref relatif à son fichier (« ../components/schemas/ressources.yaml#/Ressource »).
# Validation : npx @redocly/cli@2.58.2 lint openapi.yaml (depuis ce dossier) ; puis
# node team/scripts/detaillee-pages.mjs docs/30-conception --check.
#
# Conventions par défaut de la team (un socle qui en retient d'autres, JSON:API par exemple, les
# adapte ici et dans components/ ; l'écart au socle passe par un ADR) :
#   - OpenAPI 3.1, toutes les routes sous /api, URL du serveur local : celle du socle de stack
#   - corps en application/json, ressources à plat, sans enveloppe
#   - erreurs en application/problem+json (RFC 9457) avec un champ "code" métier stable, valeur de
#     CodeErreur ; le front traduit code, jamais title ni detail
#   - requête mal formée en 400, session absente en 401, rôle insuffisant en 403, ressource
#     inconnue en 404, conflit d'état en 409, règle de saisie en 422, imprévu en 500
#   - codes communs attendus par le générateur : VALIDATION, NON_AUTHENTIFIE, ERREUR_INTERNE
#   - pagination et filtres : A REMPLACER selon le socle, ou « aucune pagination, chaque liste est
#     bornée par ses filtres »
#
# Évolution du contrat d'API (CF-58, CF-59 du contrat de conformité, detaillee/transverse/conformite.html) :
#   - une opération "fige" ne perd rien et ne change rien. Seuls les ajouts rétrocompatibles sont
#     permis : paramètre ou propriété de requête facultatifs, propriété de réponse, valeur d'enum
#     annoncée d'avance avec sa release (x-enum-releases). Avant sa release, un élément annoncé n'est
#     ni envoyé par le serveur ni accepté par lui (400 VALIDATION).
#   - le front ignore une propriété de réponse et traduit une valeur d'enum qu'il ne connaît pas
#     comme le cas générique de l'écran.
#   - une opération "provisoire" change librement jusqu'au sprint planning qui la fige.
#   - info.version : majeure interdite sans ADR accepté (rupture d'une opération figée) ; mineure à
#     chaque ajout rétrocompatible figé, ou opération qui passe de provisoire à figée ; correctif
#     pour un changement sans effet sur une opération figée (texte, exemple, opération provisoire).
#   - chaque version a son entrée en tête de info.x-changelog, tenue à la main par l'architecte au
#     planning qui fige ou ajoute ; le générateur refuse une version sans entrée.
#
# Extensions de la team (lues par le générateur, ignorées par les outils OpenAPI) :
#   info        x-changelog      [{ version, date 'AAAA-MM-JJ', changes: ["genre : texte"] }], la plus
#                                récente d'abord ; genre : ajout, annonce, figé, correction, rupture
#   opération   x-endpoint-id    EP-xx de la conception macro (obligatoire)
#               x-release        première release qui en a besoin : MVP, R2, R3 (obligatoire)
#               x-contract       fige (opération figée, le front part sur un mock) ou provisoire
#                                (attend une réponse métier) ; obligatoire, aucune autre valeur
#               x-roles          rôles admis, ou public (obligatoire) ; la matrice des droits en sort
#               x-module         module du code backend où vit l'opération (obligatoire) ; une ligne de
#                                la table des modules (table.modules) de l'organisation du code
#               x-data-control   contrôles sur les données, au-delà du rôle (liste de phrases)
#               x-processes      traitements TR-xx appelés
#               x-entities       accès aux entités, en lettres d'une matrice CRUD (C création, R lecture,
#                                U mise à jour, D suppression) : [{ id: EN-xx, access: CU }] pour un accès
#                                direct ; [{ id: EN-xx, access: C, via: TR-xx }] pour l'accès réellement
#                                obtenu par un traitement de x-processes, inclus dans ce que le traitement
#                                déclare (meta entites) ; une ligne par entité que touche chaque traitement
#               x-rules          règles de gestion RG-xx et calculs CALC-xx appliqués
#               x-idempotence    comportement d'un second appel identique
#               x-sequence       diagramme de séquence mermaid ; l'endpoint ouvre et ferme la
#                                transaction, un traitement jamais ; « participant F as Front EC-xx »
#                                relie la séquence à l'écran (vue écrans)
#               x-open           points ouverts de l'opération, chacun écrit une seule fois, rangés par
#                                impact décroissant : [{ impact: fort | moyen | faible, sujet: ce qui
#                                reste à trancher, hypothese: ce que le code suit en attendant,
#                                question: Q-xxx si elle est posée }] ; fort : modèle de données ou
#                                opération figée ; moyen : opération provisoire, traitement, schéma non
#                                figé, écran ; faible : libellé, message, cas limite. Aucune hypothèse
#                                ailleurs dans le contrat d'API
#   réponse     x-codes          codes d'erreur métier (CodeErreur) que la réponse peut porter
#   paramètre   x-release        release qui ajoute le paramètre, s'il arrive après l'opération
#   schéma      x-entity         entité EN-xx dont le schéma est la projection réelle (pas un calcul)
#               x-release        sur une propriété : release qui l'ajoute, si elle arrive plus tard
#               x-enum-releases  valeurs d'enum annoncées et leur release : { valeur: R3 }
#               x-for-codes      sur une propriété de Probleme : codes qui la renseignent
#               x-error-catalog  sur CodeErreur : status, case, screen (comportement à l'écran, avec
#                                EC-xx et MSG-xx) de chaque code, et entity, l'entité EN-xx que le
#                                code met en cause
#
# Niveaux d'exigence contrôlés par le générateur :
#   toute opération   x-endpoint-id, x-release, x-contract, x-roles, x-module : erreur s'il manque
#   figée qui écrit   (C, U ou D) x-idempotence, x-sequence, x-entities ou x-processes : erreur s'il manque
#   figée en lecture  x-entities ou x-processes : erreur ; x-sequence : avertissement s'il manque
#   provisoire        summary, x-roles, x-entities ou x-processes, x-open : erreur s'il manque ;
#                     séquence et exemples facultatifs
#
# Pièges : un texte YAML non quoté qui contient « : » devient un objet (mettre entre guillemets) ;
# un nom de schéma d'un seul mot (Ressource) n'est lié dans les pages que s'il est entre accents graves.
openapi: 3.1.0
info:
  title: NOM_PROJET API
  version: 0.1.0
  description: >-
    A REMPLACER : une phrase sur le périmètre de l'API (toutes releases). Les opérations x-contract
    "fige" sont figées ; les "provisoire" seront figées au sprint planning qui les prend.
  x-changelog:
    - version: 0.1.0
      date: '2026-01-01'
      changes:
        - "figé : EP-01 ; EP-02 provisoire (release R2)"
  license:
    name: usage interne, données fictives
    identifier: CC0-1.0
servers:
  - url: http://localhost:3000/api
    description: local, A REMPLACER par l'URL du socle de stack
security:
  - session: []
tags:
  - name: ressources
    description: A REMPLACER, un tag par domaine fonctionnel

paths:
  /ressources: {$ref: paths/ressources.yaml}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: A REMPLACER par le mode d'authentification de la conception macro (ADR).

  parameters:
    Jour: {$ref: components/parameters.yaml#/Jour}

  schemas:
    Jour: {$ref: components/schemas/commun.yaml#/Jour}
    StatutRessource: {$ref: components/schemas/ressources.yaml#/StatutRessource}
    Ressource: {$ref: components/schemas/ressources.yaml#/Ressource}
    RessourceDemande: {$ref: components/schemas/ressources.yaml#/RessourceDemande}
    CodeErreur: {$ref: components/schemas/erreurs.yaml#/CodeErreur}
    Probleme: {$ref: components/schemas/erreurs.yaml#/Probleme}

  responses:
    BadRequest: {$ref: components/responses.yaml#/BadRequest}
    Unauthorized: {$ref: components/responses.yaml#/Unauthorized}
    Forbidden: {$ref: components/responses.yaml#/Forbidden}
    InternalError: {$ref: components/responses.yaml#/InternalError}
