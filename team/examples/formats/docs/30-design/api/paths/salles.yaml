# Path item /salles, referenced by openapi.yaml

get:
  tags: [salles]
  operationId: listerSalles
  x-endpoint-id: EP-04
  x-module: domain/salle
  x-release: MVP
  x-contract: frozen
  x-roles: [employe, gestionnaire]
  x-data-control:
    - statut "desactivee" ou "toutes" réservé au gestionnaire, sinon 403 INTERDIT
  x-entities:
    - {id: EN-03, access: R}
  x-rules: [BR-08]
  x-idempotence: lecture
  x-sequence: |
    sequenceDiagram
      participant F as Front SCR-02, SCR-04, SCR-06
      participant A as API
      participant D as SQLite
      F->>A: GET /salles?statut=...
      alt statut autre que active, par un employé
        A-->>F: 403 INTERDIT
      else
        A->>D: salles du statut, avec leurs équipements
        A-->>F: 200 Salle[]
      end
  summary: Lister les salles
  description: >-
    Salles avec leurs équipements. Par défaut les salles actives seulement, triées par nom (BR-08).
    Avec `statut=toutes` (SCR-06), les salles actives d'abord, puis les désactivées, chacune par nom.
  parameters:
    - name: statut
      in: query
      required: false
      description: >-
        "active" pour tous les rôles ; "desactivee" et "toutes" pour le gestionnaire seulement.
      schema:
        type: string
        enum: [active, desactivee, toutes]
        default: active
  responses:
    '200':
      description: liste des salles
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '../components/schemas/salles.yaml#/Salle'}
          example:
            - {id: 1, nom: Atlas, capacite: 12, equipementIds: [1, 2], statut: active}
            - {id: 2, nom: Borée, capacite: 6, equipementIds: [3], statut: active}
    '400': {$ref: '../components/responses.yaml#/BadRequest'}
    '401': {$ref: '../components/responses.yaml#/Unauthorized'}
    '403': {$ref: '../components/responses.yaml#/Forbidden'}
    '500': {$ref: '../components/responses.yaml#/InternalError'}
post:
  tags: [salles]
  operationId: declarerSalle
  x-endpoint-id: EP-15
  x-module: domain/salle
  x-release: MVP
  x-contract: frozen
  x-roles: [gestionnaire]
  x-entities:
    - {id: EN-03, access: CR}
    - {id: EN-04, access: R}
  x-rules: [BR-10]
  x-idempotence: >-
    Non idempotent ; un second envoi identique répond 409 NOM_SALLE_PRIS tant que BR-10 tient. Le
    front désactive « Enregistrer » pendant l'appel.
  x-sequence: |
    sequenceDiagram
      actor G as Gestionnaire
      participant F as Front SCR-07
      participant A as API
      participant D as SQLite
      G->>F: nom, capacité, équipements, Enregistrer
      F->>A: POST /salles
      A->>D: BEGIN IMMEDIATE (UnitOfWork)
      A->>D: équipements connus ?
      alt équipement inconnu
        A->>D: ROLLBACK
        A-->>F: 422 EQUIPEMENT_INCONNU
      else nom déjà porté par une salle active (BR-10)
        A->>D: ROLLBACK
        A-->>F: 409 NOM_SALLE_PRIS
        F-->>G: MSG-07 sous Nom
      else
        A->>D: INSERT salles, salle_equipements
        A->>D: COMMIT
        A-->>F: 201 Salle
        F-->>G: SCR-06, la salle dans le tableau
      end
  x-open:
    - impact: high
      subject: "Unicité du nom parmi les salles actives, que suppose BR-10 : avec « non », le 409 NOM_SALLE_PRIS et l'index unique partiel de EN-03 disparaissent."
      hypothesis: "nom unique parmi les salles actives."
      question: Q-003
  summary: Déclarer une salle
  description: >-
    Crée une salle active avec sa capacité et ses équipements. Le nom est unique parmi les salles
    actives (BR-10), contrôlé par le domaine et par l'index unique partiel de EN-03.
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: '../components/schemas/salles.yaml#/SalleDemande'}
        example: {nom: Cassiopée, capacite: 8, equipementIds: [1, 3]}
  responses:
    '201':
      description: salle créée, active
      content:
        application/json:
          schema: {$ref: '../components/schemas/salles.yaml#/Salle'}
    '400': {$ref: '../components/responses.yaml#/BadRequest'}
    '401': {$ref: '../components/responses.yaml#/Unauthorized'}
    '403': {$ref: '../components/responses.yaml#/Forbidden'}
    '409':
      description: une salle active porte déjà ce nom (BR-10)
      x-codes: [NOM_SALLE_PRIS]
      content:
        application/problem+json:
          schema: {$ref: '../components/schemas/errors.yaml#/Probleme'}
    '422':
      description: un identifiant d'équipement n'existe pas
      x-codes: [EQUIPEMENT_INCONNU]
      content:
        application/problem+json:
          schema: {$ref: '../components/schemas/errors.yaml#/Probleme'}
    '500': {$ref: '../components/responses.yaml#/InternalError'}
