# domain: Réservations
# Schémas nommés dans openapi.yaml sous components/schemas

Reservation:
  type: object
  additionalProperties: false
  x-entity: EN-05
  description: réservation active, telle que tous les employés la voient
  required: [id, salleId, jour, debut, fin, titulaire, estAMoi, serieId, annulable]
  properties:
    id: {type: integer, minimum: 1}
    salleId: {type: integer, minimum: 1}
    jour: {$ref: 'common.yaml#/Jour'}
    debut: {$ref: 'common.yaml#/Heure'}
    fin: {$ref: 'common.yaml#/Heure'}
    titulaire:
      type: object
      additionalProperties: false
      required: [nom]
      properties:
        nom: {type: string, description: 'Prénom Nom, jamais l''email'}
    estAMoi:
      type: boolean
      description: vrai si le titulaire est l'employé de la session (couleur d'accent sur SCR-02)
    serieId:
      type: [integer, 'null']
      description: série d'appartenance, null pour une réservation ponctuelle
    annulable:
      type: boolean
      description: >-
        pas commencée à l'horloge du serveur (BR-03) et annulable par l'employé de la session,
        titulaire ou gestionnaire (BR-11) ; « Annuler » s'affiche. Même calcul que dans
        MaReservation.
  examples:
    - {
        id: 41,
        salleId: 1,
        jour: '2026-10-06',
        debut: '10:00',
        fin: '11:00',
        titulaire: {nom: Léa Martin},
        estAMoi: true,
        serieId: 7,
        annulable: true
      }
ReservationDemande:
  type: object
  additionalProperties: false
  description: >-
    créneau demandé, pour une réservation (EP-08) ou une modification (EP-19) ; le titulaire est
    toujours l'employé de la session, jamais un champ du corps (INV-63)
  required: [salleId, jour, debut, fin]
  properties:
    salleId: {type: integer, minimum: 1}
    jour: {$ref: 'common.yaml#/Jour'}
    debut: {$ref: 'common.yaml#/Heure'}
    fin: {$ref: 'common.yaml#/Heure'}
  examples:
    - {salleId: 1, jour: '2026-10-06', debut: '10:00', fin: '11:00'}
MaReservation:
  type: object
  additionalProperties: false
  x-entity: EN-05
  description: une réservation de l'employé de la session, sur SCR-05
  required: [id, salleId, salleNom, jour, debut, fin, statut, serieId, annulable, annulation]
  properties:
    id: {type: integer, minimum: 1}
    salleId: {type: integer, minimum: 1}
    salleNom: {type: string, description: 'nom de la salle, même désactivée'}
    jour: {$ref: 'common.yaml#/Jour'}
    debut: {$ref: 'common.yaml#/Heure'}
    fin: {$ref: 'common.yaml#/Heure'}
    statut: {type: string, enum: [active, annulee]}
    serieId: {type: [integer, 'null']}
    annulable:
      type: boolean
      description: active et pas commencée à l'horloge du serveur (BR-03) ; « Annuler » s'affiche
    annulation:
      type: [object, 'null']
      description: renseignée si un autre que le titulaire a annulé ; texte de MSG-05
      additionalProperties: false
      required: [motif, le]
      properties:
        motif: {type: string, maxLength: 200}
        le: {type: string, format: date-time}
  examples:
    - {
        id: 41,
        salleId: 1,
        salleNom: Atlas,
        jour: '2026-10-06',
        debut: '10:00',
        fin: '11:00',
        statut: active,
        serieId: 7,
        annulable: true,
        annulation: null
      }
AnnulationDemande:
  type: object
  additionalProperties: false
  description: motif, obligatoire quand le gestionnaire annule pour autrui (BR-07)
  properties:
    motif: {type: string, minLength: 1, maxLength: 200}
  examples:
    - {motif: Salle réquisitionnée pour la visite du comité.}
CreneauPropose:
  type: object
  additionalProperties: false
  description: créneau libre proposé par PROC-04 (échangé par une opération provisoire, release R2)
  required: [salleId, salleNom, jour, debut, fin, ecartMinutes]
  properties:
    salleId: {type: integer, minimum: 1}
    salleNom: {type: string}
    jour: {$ref: 'common.yaml#/Jour'}
    debut: {$ref: 'common.yaml#/Heure'}
    fin: {$ref: 'common.yaml#/Heure'}
    ecartMinutes: {type: integer, description: 'début proposé moins début demandé, négatif si avant'}
