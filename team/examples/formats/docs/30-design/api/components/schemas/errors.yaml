# domain: Erreurs
# Schémas nommés dans openapi.yaml sous components/schemas


CodeErreur:
  type: string
  description: code métier stable, traduit par le front en message MSG-xx ou MSG-Uxx (INV-64)
  enum:
    - VALIDATION
    - UNAUTHENTICATED
    - IDENTIFIANTS_REFUSES
    - TROP_DE_TENTATIVES
    - INTERDIT
    - SALLE_INTROUVABLE
    - RESERVATION_INTROUVABLE
    - SERIE_INTROUVABLE
    - SALLE_DESACTIVEE
    - NOM_SALLE_PRIS
    - EQUIPEMENT_INCONNU
    - CRENEAU_HORS_REGLES
    - CRENEAU_PRIS
    - DEJA_COMMENCEE
    - MOTIF_OBLIGATOIRE
    - SERIE_TROP_LONGUE
    - SERIE_CONFLITS_CHANGES
    - JOURS_CONFIRMES_INVALIDES
    - PERIODE_INVALIDE
    - HORS_FENETRE_PRESENCE
    - INTERNAL_ERROR
  x-enum-releases: {PERIODE_INVALIDE: R2, HORS_FENETRE_PRESENCE: R3}
  x-error-catalog:
    VALIDATION:
      status: 400
      case: paramètre ou corps hors schéma ; erreurs[] par champ
      screen: ne doit pas arriver (sélecteurs, champs bornés) ; traité comme l'erreur technique de l'écran
    UNAUTHENTICATED:
      status: 401
      case: session absente ou expirée
      screen: SCR-01, puis retour à la page demandée
    IDENTIFIANTS_REFUSES:
      status: 401
      case: email inconnu ou mot de passe faux, sans dire lequel
      screen: SCR-01, MSG-U01, mot de passe vidé
    TROP_DE_TENTATIVES:
      status: 429
      case: plus de 5 tentatives de connexion en une minute depuis la même adresse
      screen: SCR-01, MSG-U01
    INTERDIT:
      status: 403
      case: rôle insuffisant, ou ni titulaire ni gestionnaire (BR-11)
      screen: écran du gestionnaire ouvert par l'URL, retour à SCR-02 avec MSG-U10 ; ailleurs, erreur
        technique de l'écran
    SALLE_INTROUVABLE:
      entity: EN-03
      status: 404
      case: salle inconnue (URL modifiée à la main)
      screen: SCR-04 MSG-U06, SCR-07 MSG-U11, liste des salles rechargée
    RESERVATION_INTROUVABLE:
      entity: EN-05
      status: 404
      case: réservation inconnue
      screen: SCR-05 et SCR-02, liste rechargée
    SERIE_INTROUVABLE:
      entity: EN-06
      status: 404
      case: série inconnue
      screen: SCR-05, liste rechargée
    SALLE_DESACTIVEE:
      entity: EN-03
      status: 422
      case: salle désactivée entre l'affichage et l'envoi (BR-08)
      screen: SCR-04, MSG-U06, liste des salles rechargée
    NOM_SALLE_PRIS:
      entity: EN-03
      status: 409
      case: une salle active porte déjà ce nom (BR-10)
      screen: SCR-07, MSG-07 sous Nom
    EQUIPEMENT_INCONNU:
      entity: EN-04
      status: 422
      case: identifiant d'équipement absent du référentiel
      screen: SCR-07, MSG-U11 ; ne doit pas arriver (cases à cocher)
    CRENEAU_HORS_REGLES:
      status: 422
      case: BR-02 ou BR-03 refusée par le serveur malgré les sélecteurs (horloge du poste décalée)
      screen: SCR-04, SCR-03, MSG-03 en bandeau, saisie conservée
    CRENEAU_PRIS:
      entity: EN-05
      status: 409
      case: la salle vient d'être prise (BR-01), par le domaine ou par le déclencheur
      screen: SCR-04, MSG-01 avec conflit, saisie conservée
    DEJA_COMMENCEE:
      entity: EN-05
      status: 409
      case: réservation commencée entre l'affichage et l'action (BR-03)
      screen: SCR-05, SCR-02, liste rechargée, « Annuler » disparaît
    MOTIF_OBLIGATOIRE:
      status: 422
      case: le gestionnaire annule pour autrui sans motif (BR-07)
      screen: ne doit pas arriver (bouton désactivé tant que le motif est vide)
    SERIE_TROP_LONGUE:
      status: 422
      case: jusquAu au-delà de 3 mois (BR-04), champ jusquAu
      screen: SCR-04, MSG-U13 sous Jusqu'au, « Réserver » désactivé
    SERIE_CONFLITS_CHANGES:
      status: 409
      case: une occurrence confirmée prise depuis l'aperçu ; apercu joint
      screen: dialogue Conflits de la série rouvert avec la nouvelle liste et MSG-04 recalculé
    JOURS_CONFIRMES_INVALIDES:
      status: 422
      case: un jour confirmé n'est pas une occurrence de la série (défaut du front)
      screen: SCR-04, MSG-U06
    PERIODE_INVALIDE:
      status: 422
      case: période à l'envers ou trop longue (releases R2 et R3)
      screen: SCR-08, SCR-09, sélecteurs bornés ; erreur technique de l'écran
    HORS_FENETRE_PRESENCE:
      status: 409
      case: présence confirmée hors de la fenêtre, ou réservation annulée (release R3)
      screen: SCR-05, liste rechargée
    INTERNAL_ERROR:
      status: 500
      case: imprévu ; transaction annulée, rien n'est créé
      screen: message d'erreur de l'écran (MSG-U03, MSG-U05, MSG-U06, MSG-U08, MSG-U09, MSG-U11) avec «
        Réessayer »
Probleme:
  type: object
  description: >-
    Erreur au format RFC 9457 (application/problem+json), avec les extensions du projet (ADR-0004).
    Le front traduit `code`, jamais `title` ni `detail` (INV-64).
  required: [title, status, code]
  properties:
    type: {type: string, default: about:blank}
    title: {type: string, description: résumé stable pour un même code}
    status: {type: integer}
    detail: {type: string, description: 'explication propre à l''occurrence, jamais affichée telle quelle'}
    instance: {type: string, description: 'identifiant de requête, pour les journaux'}
    code: {$ref: '#/CodeErreur'}
    champ:
      type: string
      description: champ du corps ou paramètre en cause (422 de règle sur un champ)
      x-for-codes: [SERIE_TROP_LONGUE]
    erreurs:
      type: array
      description: erreurs de forme, une par champ
      x-for-codes: [VALIDATION]
      items:
        type: object
        required: [champ, message]
        properties:
          champ: {type: string}
          message: {type: string}
    conflit:
      type: object
      description: réservation existante en conflit, pour MSG-01
      x-for-codes: [CRENEAU_PRIS]
      required: [salleNom, debut, fin]
      properties:
        salleNom: {type: string}
        debut: {$ref: 'common.yaml#/Heure'}
        fin: {$ref: 'common.yaml#/Heure'}
    apercu:
      description: nouvel aperçu de la série
      x-for-codes: [SERIE_CONFLITS_CHANGES]
      $ref: 'series.yaml#/SerieApercu'
  examples:
    - {
        type: about:blank,
        title: Créneau déjà réservé,
        status: 409,
        code: CRENEAU_PRIS,
        conflit: {salleNom: Atlas, debut: '09:30', fin: '10:30'}
      }
