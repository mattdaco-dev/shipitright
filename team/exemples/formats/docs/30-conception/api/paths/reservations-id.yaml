# Path item /reservations/{id}, referenced by openapi.yaml

parameters:
  - {$ref: '../components/parameters.yaml#/IdReservation'}
put:
  tags: [reservations]
  operationId: modifierReservation
  x-endpoint-id: EP-19
  x-module: domain/reservation
  x-release: R2
  x-contract: provisoire
  x-roles: [employe, gestionnaire]
  x-data-control:
    - titulaire seulement, sinon 403 INTERDIT ; le gestionnaire ne déplace pas la réservation
      d'autrui
  x-processes: [TR-02]
  x-entities:
    - {id: EN-05, access: RU, via: TR-02}
    - {id: EN-03, access: R, via: TR-02}
  x-rules: [RG-01, RG-02, RG-03, RG-08]
  x-idempotence: idempotent ; un second envoi identique ne change rien et répond 200
  x-sequence: |
    sequenceDiagram
      actor U as Titulaire
      participant F as Front EC-05
      participant A as API
      participant T as TR-02
      participant D as SQLite
      U->>F: nouvelle salle ou nouvel horaire, Enregistrer
      F->>A: PUT /reservations/{id}
      A->>D: BEGIN IMMEDIATE (UnitOfWork)
      A->>D: réservation, titulaire, pas commencée (RG-03)
      alt pas le titulaire
        A->>D: ROLLBACK
        A-->>F: 403 INTERDIT
      else déjà commencée
        A->>D: ROLLBACK
        A-->>F: 409 DEJA_COMMENCEE
      else
        A->>T: contrôler le nouveau créneau, en excluant la réservation elle-même
        alt conflit ou hors règles
          T-->>A: refus CRENEAU_PRIS, CRENEAU_HORS_REGLES ou SALLE_DESACTIVEE
          A->>D: ROLLBACK
          A-->>F: 409 CRENEAU_PRIS ou 422
        else
          T->>D: UPDATE reservations (déclencheur BEFORE UPDATE)
          T-->>A: réservation
          A->>D: COMMIT
          A-->>F: 200 Reservation
        end
      end
  x-open:
    - impact: moyen
      sujet: "Sort d'une occurrence modifiée vis-à-vis de sa série."
      hypothese: "elle reste dans sa série (analyse modification, option B)."
    - impact: moyen
      sujet: "Écran de modification : la spec UX/UI n'en prévoit pas ; la conception macro fait partir l'appel de EC-05."
      hypothese: "action « Modifier » sur une réservation à venir de EC-05, qui ouvre un formulaire salle, jour, début et fin sur le modèle de EC-04."
    - impact: faible
      sujet: "Release de la modification, MVP ou release R2 ; seule la release change."
      hypothese: "Release R2."
      question: Q-002
  summary: Modifier l'horaire ou la salle d'une réservation
  description: >-
    Remplace le créneau d'une réservation active qui n'a pas commencé, en un seul UPDATE dans une
    transaction immédiate, par TR-02 : l'ancien créneau n'est jamais libéré avant que le nouveau
    soit acquis (ADR-0002).
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: '../components/schemas/reservations.yaml#/ReservationDemande'}
  responses:
    '200':
      description: réservation modifiée
      content:
        application/json:
          schema: {$ref: '../components/schemas/reservations.yaml#/Reservation'}
    '400': {$ref: '../components/responses.yaml#/BadRequest'}
    '401': {$ref: '../components/responses.yaml#/Unauthorized'}
    '403':
      description: pas le titulaire de la réservation, gestionnaire compris
      x-codes: [INTERDIT]
      content:
        application/problem+json:
          schema: {$ref: '../components/schemas/erreurs.yaml#/Probleme'}
    '404':
      description: réservation ou salle inconnue
      x-codes: [RESERVATION_INTROUVABLE, SALLE_INTROUVABLE]
      content:
        application/problem+json:
          schema: {$ref: '../components/schemas/erreurs.yaml#/Probleme'}
    '409':
      description: nouveau créneau pris (RG-01) ou réservation déjà commencée (RG-03)
      x-codes: [CRENEAU_PRIS, DEJA_COMMENCEE]
      content:
        application/problem+json:
          schema: {$ref: '../components/schemas/erreurs.yaml#/Probleme'}
    '422':
      description: nouveau créneau hors règles ou salle désactivée
      x-codes: [CRENEAU_HORS_REGLES, SALLE_DESACTIVEE]
      content:
        application/problem+json:
          schema: {$ref: '../components/schemas/erreurs.yaml#/Probleme'}
    '500': {$ref: '../components/responses.yaml#/InternalError'}
