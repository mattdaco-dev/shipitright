# Path item /salles/{id}, referenced by openapi.yaml

parameters:
  - {$ref: '../components/parameters.yaml#/IdSalle'}
get:
  tags: [salles]
  operationId: lireSalle
  x-endpoint-id: EP-14
  x-module: domain/salle
  x-release: MVP
  x-contract: fige
  x-roles: [gestionnaire]
  x-entities:
    - {id: EN-03, access: R}
    - {id: EN-05, access: R}
  x-rules: [RG-08, RG-03]
  x-idempotence: lecture
  x-sequence: |
    sequenceDiagram
      actor G as Gestionnaire
      participant F as Front EC-06, EC-07
      participant A as API
      participant D as SQLite
      G->>F: Modifier ou Désactiver sur une salle
      F->>A: GET /salles/{id}
      A->>D: salle et équipements
      A->>D: COUNT réservations actives futures de la salle (début après maintenant)
      alt salle inconnue
        A-->>F: 404 SALLE_INTROUVABLE
      else
        A-->>F: 200 SalleDetail
        F-->>G: EC-07 prérempli, ou dialogue de désactivation avec MSG-08
      end
  summary: Lire une salle et ses réservations futures
  description: >-
    La salle, plus le nombre de réservations futures que sa désactivation annulerait (MSG-08). La
    réservation en cours n'est pas comptée : elle reste active (RG-03, RG-08).
  responses:
    '200':
      description: la salle et le compte des réservations futures
      content:
        application/json:
          schema: {$ref: '../components/schemas/salles.yaml#/SalleDetail'}
    '401': {$ref: '../components/responses.yaml#/Unauthorized'}
    '403': {$ref: '../components/responses.yaml#/Forbidden'}
    '404': {$ref: '../components/responses.yaml#/SalleIntrouvable'}
    '500': {$ref: '../components/responses.yaml#/InternalError'}
put:
  tags: [salles]
  operationId: modifierSalle
  x-endpoint-id: EP-16
  x-module: domain/salle
  x-release: MVP
  x-contract: fige
  x-roles: [gestionnaire]
  x-entities:
    - {id: EN-03, access: RU}
    - {id: EN-04, access: R}
  x-rules: [RG-10]
  x-idempotence: idempotent ; remplace nom, capacité et équipements par ceux du corps
  x-sequence: |
    sequenceDiagram
      actor G as Gestionnaire
      participant F as Front EC-07
      participant A as API
      participant D as SQLite
      G->>F: Enregistrer
      F->>A: PUT /salles/{id}
      A->>D: BEGIN IMMEDIATE (UnitOfWork)
      A->>D: salle, équipements connus, nom libre parmi les autres salles actives
      alt salle inconnue
        A->>D: ROLLBACK
        A-->>F: 404 SALLE_INTROUVABLE
      else nom pris (RG-10)
        A->>D: ROLLBACK
        A-->>F: 409 NOM_SALLE_PRIS
        F-->>G: MSG-07 sous Nom
      else
        A->>D: UPDATE salles, remplacement de salle_equipements
        A->>D: COMMIT
        A-->>F: 200 Salle
        F-->>G: EC-06
      end
  x-open:
    - impact: fort
      sujet: "Modification d'une salle désactivée, et d'une capacité inférieure aux réservations existantes : un refus ajouterait un cas à une opération figée."
      hypothese: "une salle désactivée reste modifiable ; réduire la capacité ne touche pas aux réservations, qui ne portent pas de nombre de participants."
  summary: Modifier une salle
  description: >-
    Remplace le nom, la capacité et les équipements. Le statut ne change pas ici : la désactivation
    passe par EP-17.
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: '../components/schemas/salles.yaml#/SalleDemande'}
  responses:
    '200':
      description: salle modifiée
      content:
        application/json:
          schema: {$ref: '../components/schemas/salles.yaml#/Salle'}
    '400': {$ref: '../components/responses.yaml#/BadRequest'}
    '401': {$ref: '../components/responses.yaml#/Unauthorized'}
    '403': {$ref: '../components/responses.yaml#/Forbidden'}
    '404': {$ref: '../components/responses.yaml#/SalleIntrouvable'}
    '409':
      description: une autre salle active porte déjà ce nom (RG-10)
      x-codes: [NOM_SALLE_PRIS]
      content:
        application/problem+json:
          schema: {$ref: '../components/schemas/erreurs.yaml#/Probleme'}
    '422':
      description: un identifiant d'équipement n'existe pas
      x-codes: [EQUIPEMENT_INCONNU]
      content:
        application/problem+json:
          schema: {$ref: '../components/schemas/erreurs.yaml#/Probleme'}
    '500': {$ref: '../components/responses.yaml#/InternalError'}
