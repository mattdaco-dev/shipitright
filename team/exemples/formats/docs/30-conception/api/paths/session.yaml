# Path item /session, referenced by openapi.yaml

post:
  tags: [session]
  operationId: ouvrirSession
  x-endpoint-id: EP-01
  x-module: domain/session
  x-release: MVP
  x-contract: fige
  x-roles: [public]
  x-data-control:
    - seule route publique ; limitée à 5 tentatives par minute et par adresse
    - le refus ne dit pas si l'email existe (même code pour email inconnu et mot de passe faux)
  x-entities:
    - {id: EN-01, access: R}
    - {id: EN-02, access: CD}
  x-idempotence: >-
    Chaque appel réussi ouvre une nouvelle session ; l'ancienne reste valide jusqu'à son expiration
    ou à EP-03.
  x-sequence: |
    sequenceDiagram
      actor U as Employé
      participant F as Front EC-01
      participant A as API
      participant D as SQLite
      U->>F: email, mot de passe, Se connecter
      F->>A: POST /session
      A->>A: limite de débit (5 par minute et par adresse)
      A->>D: employé par email
      A->>A: empreinte scrypt comparée en temps constant
      alt identifiants refusés
        A-->>F: 401 IDENTIFIANTS_REFUSES
        F-->>U: MSG-U01, mot de passe vidé
      else trop de tentatives
        A-->>F: 429 TROP_DE_TENTATIVES
        F-->>U: MSG-U01
      else
        A->>A: jeton aléatoire de 32 octets
        A->>D: INSERT sessions (empreinte(jeton), expiration à 8 h)
        A-->>F: 200 Utilisateur, Set-Cookie rs_session
        F-->>U: EC-02, ou la page demandée avant la connexion
      end
  x-open:
    - impact: faible
      sujet: "Nom du cookie de session et durée de vie : aucune règle ne les fixe."
      hypothese: "cookie rs_session, 8 heures glissantes (ADR-0003)."
    - impact: faible
      sujet: "Message après trop de tentatives de connexion : la spec UX/UI n'en prévoit pas."
      hypothese: "MSG-U01."
  summary: Se connecter
  description: >-
    Vérifie l'email et le mot de passe contre l'empreinte scrypt de EN-01, crée une session en base
    et pose le cookie `rs_session` (HttpOnly, SameSite=Strict, Secure hors local), ADR-0003.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: '../components/schemas/session.yaml#/ConnexionDemande'}
        example: {email: lea.martin@exemple.test, motDePasse: demo-2026}
  responses:
    '200':
      description: session ouverte, cookie posé
      headers:
        Set-Cookie:
          description: rs_session=<jeton>; HttpOnly; SameSite=Strict; Path=/api
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '../components/schemas/session.yaml#/Utilisateur'}
    '400': {$ref: '../components/responses.yaml#/BadRequest'}
    '401':
      description: email inconnu ou mot de passe faux (IDENTIFIANTS_REFUSES)
      x-codes: [IDENTIFIANTS_REFUSES]
      content:
        application/problem+json:
          schema: {$ref: '../components/schemas/erreurs.yaml#/Probleme'}
    '429':
      description: plus de 5 tentatives en une minute depuis la même adresse
      x-codes: [TROP_DE_TENTATIVES]
      headers:
        Retry-After:
          description: secondes avant le prochain essai
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: '../components/schemas/erreurs.yaml#/Probleme'}
    '500': {$ref: '../components/responses.yaml#/InternalError'}
get:
  tags: [session]
  operationId: lireSession
  x-endpoint-id: EP-02
  x-module: domain/session
  x-release: MVP
  x-contract: fige
  x-roles: [employe, gestionnaire]
  x-data-control:
    - renvoie l'employé de la session seulement, email compris
  x-entities:
    - {id: EN-02, access: R}
    - {id: EN-01, access: R}
  x-idempotence: lecture ; prolonge l'expiration glissante de la session
  x-sequence: |
    sequenceDiagram
      participant F as Front, bandeau de navigation
      participant A as API
      participant D as SQLite
      F->>A: GET /session, au démarrage de l'application
      A->>D: session par empreinte(jeton), non expirée, avec son employé
      alt aucune session valide
        A-->>F: 401 NON_AUTHENTIFIE
        F-->>F: EC-01, page demandée mémorisée
      else
        A->>D: expiration repoussée à 8 h
        A-->>F: 200 Utilisateur
        F-->>F: nom et entrées du bandeau selon le rôle
      end
  summary: Connaître l'utilisateur et son rôle
  description: >-
    Renvoie l'employé de la session. Le front l'appelle au démarrage pour afficher le bandeau de
    navigation et les entrées du gestionnaire.
  responses:
    '200':
      description: employé de la session
      content:
        application/json:
          schema: {$ref: '../components/schemas/session.yaml#/Utilisateur'}
    '401': {$ref: '../components/responses.yaml#/Unauthorized'}
    '500': {$ref: '../components/responses.yaml#/InternalError'}
delete:
  tags: [session]
  operationId: fermerSession
  x-endpoint-id: EP-03
  x-module: domain/session
  x-release: MVP
  x-contract: fige
  x-roles: [public]
  x-data-control:
    - ne supprime que la session du cookie présenté
  x-entities:
    - {id: EN-02, access: D}
  x-idempotence: >-
    Idempotent : 204 même sans session ou avec une session déjà expirée, pour que la déconnexion
    n'échoue jamais.
  x-sequence: |
    sequenceDiagram
      actor U as Employé
      participant F as Front, bandeau de navigation
      participant A as API
      participant D as SQLite
      U->>F: Se déconnecter
      F->>A: DELETE /session
      A->>D: DELETE sessions WHERE jeton_empreinte = empreinte(jeton du cookie)
      A-->>F: 204, cookie effacé (Max-Age=0)
      F-->>U: EC-01
  summary: Se déconnecter
  description: Supprime la session du cookie et efface le cookie.
  security: []
  responses:
    '204':
      description: session fermée, cookie effacé
    '500': {$ref: '../components/responses.yaml#/InternalError'}
