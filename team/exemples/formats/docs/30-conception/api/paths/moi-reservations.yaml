# Path item /moi/reservations, referenced by openapi.yaml

get:
  tags: [reservations]
  operationId: listerMesReservations
  x-endpoint-id: EP-11
  x-module: domain/reservation
  x-release: MVP
  x-contract: fige
  x-roles: [employe, gestionnaire]
  x-data-control:
    - les réservations de l'employé de la session seulement ; aucun paramètre d'employé
  x-entities:
    - {id: EN-05, access: R}
    - {id: EN-03, access: R}
  x-rules: [RG-03, RG-07]
  x-idempotence: lecture
  x-sequence: |
    sequenceDiagram
      actor U as Employé
      participant F as Front EC-05
      participant A as API
      participant D as SQLite
      U->>F: Mes réservations, ou retour après une réservation
      F->>A: GET /moi/reservations
      A->>D: actives non terminées, et annulées par un autre depuis moins de 7 jours
      A->>A: annulable (RG-03, horloge)
      A-->>F: 200 MaReservation[]
      alt liste vide
        F-->>U: MSG-U07
      else
        F-->>U: liste par jour, annulées barrées avec MSG-05
      end
  summary: Lister mes réservations
  description: >-
    Réservations de l'employé de la session, par jour puis par début : les actives qui ne sont pas
    terminées, et celles qu'un autre (gestionnaire, désactivation de salle) a annulées depuis moins
    de 7 jours, avec leur motif (MSG-05). `annulable` dit si « Annuler » s'affiche (RG-03).
  responses:
    '200':
      description: réservations de l'employé
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '../components/schemas/reservations.yaml#/MaReservation'}
    '401': {$ref: '../components/responses.yaml#/Unauthorized'}
    '500': {$ref: '../components/responses.yaml#/InternalError'}
