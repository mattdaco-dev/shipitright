# Path item /series/apercu, referenced by openapi.yaml

post:
  tags: [series]
  operationId: apercevoirSerie
  x-endpoint-id: EP-09
  x-module: domain/serie
  x-release: MVP
  x-contract: fige
  x-roles: [employe, gestionnaire]
  x-data-control:
    - l'aperçu dit « conflit », jamais qui occupe
  x-processes: [TR-01]
  x-entities:
    - {id: EN-03, access: R, via: TR-01}
    - {id: EN-05, access: R, via: TR-01}
  x-rules: [RG-04, CALC-01, RG-01, RG-05]
  x-idempotence: >-
    N'écrit rien : rejouable sans effet. POST parce que la demande est un objet. Le front l'appelle
    à chaque changement du formulaire, 300 ms après la dernière saisie en annulant l'appel
    précédent, puis une dernière fois au clic sur « Réserver ».
  x-sequence: |
    sequenceDiagram
      actor U as Employé
      participant F as Front EC-04
      participant A as API
      participant T as TR-01
      participant D as SQLite
      U->>F: Répéter, fréquence, Jusqu'au
      F->>A: POST /series/apercu, 300 ms après la dernière saisie
      A->>T: occurrences et conflits
      T->>T: occurrences (CALC-01, RG-04), fonction pure
      alt plus de 3 mois
        A-->>F: 422 SERIE_TROP_LONGUE, champ jusquAu
        F-->>U: MSG-U13 sous Jusqu'au
      else
        T->>D: réservations actives de la salle sur la période, au même créneau
        A-->>F: 200 SerieApercu
        F-->>U: récapitulatif, n occurrences
      end
  x-open:
    - impact: fort
      sujet: "Jours fériés dans une série : avec « oui », TR-01 lit un calendrier des jours fériés et `SerieApercu` marque les jours exclus, le schéma change."
      hypothese: "jours fériés non exclus."
      question: Q-005
  summary: Calculer les occurrences d'une série et leurs conflits
  description: >-
    Calcule les occurrences (CALC-01, par TR-01) et marque celles qui chevauchent une réservation
    active (RG-01). Rien n'est écrit avant confirmation (RG-05).
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: '../components/schemas/series.yaml#/SerieDemande'}
        example:
          salleId: 1
          premierJour: '2026-10-06'
          debut: '10:00'
          fin: '11:00'
          frequence: hebdomadaire
          jusquAu: '2026-12-29'
  responses:
    '200':
      description: occurrences calculées
      content:
        application/json:
          schema: {$ref: '../components/schemas/series.yaml#/SerieApercu'}
          example:
            total: 13
            libres: 12
            conflits: 1
            occurrences:
              - {jour: '2026-10-06', statut: libre}
              - {jour: '2026-10-13', statut: libre}
              - {jour: '2026-10-20', statut: conflit}
    '400': {$ref: '../components/responses.yaml#/BadRequest'}
    '401': {$ref: '../components/responses.yaml#/Unauthorized'}
    '404': {$ref: '../components/responses.yaml#/SalleIntrouvable'}
    '422':
      description: >-
        série de plus de 3 mois (RG-04, champ jusquAu), première occurrence hors règles (RG-02,
        RG-03) ou salle désactivée
      x-codes: [SERIE_TROP_LONGUE, CRENEAU_HORS_REGLES, SALLE_DESACTIVEE]
      content:
        application/problem+json:
          schema: {$ref: '../components/schemas/erreurs.yaml#/Probleme'}
          example:
            type: about:blank
            title: Série trop longue
            status: 422
            code: SERIE_TROP_LONGUE
            champ: jusquAu
    '500': {$ref: '../components/responses.yaml#/InternalError'}
