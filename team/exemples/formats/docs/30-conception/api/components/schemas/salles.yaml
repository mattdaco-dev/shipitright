# domain: Salles
# Schémas nommés dans openapi.yaml sous components/schemas

StatutSalle:
  type: string
  enum: [active, desactivee]
  description: cycle de vie de la salle (EN-03) ; « desactivee » n'est plus proposée (RG-08)
Salle:
  type: object
  additionalProperties: false
  x-entity: EN-03
  required: [id, nom, capacite, equipementIds, statut]
  properties:
    id: {type: integer, minimum: 1}
    nom: {type: string, minLength: 1, maxLength: 60}
    capacite: {type: integer, minimum: 1, maximum: 200}
    equipementIds:
      type: array
      description: identifiants des équipements (Equipement), libellés lus par EP-05
      items: {type: integer, minimum: 1}
    statut: {$ref: '#/StatutSalle'}
  examples:
    - {id: 1, nom: Atlas, capacite: 12, equipementIds: [1, 2], statut: active}
SalleDetail:
  type: object
  additionalProperties: false
  x-entity: EN-03
  description: >-
    les champs de Salle, plus ce que sa désactivation annulerait (MSG-08). Schéma à plat plutôt
    qu'un allOf de Salle : additionalProperties de Salle refuserait le champ ajouté.
  required: [id, nom, capacite, equipementIds, statut, reservationsFutures]
  properties:
    id: {type: integer, minimum: 1}
    nom: {type: string, minLength: 1, maxLength: 60}
    capacite: {type: integer, minimum: 1, maximum: 200}
    equipementIds:
      type: array
      items: {type: integer, minimum: 1}
    statut: {$ref: '#/StatutSalle'}
    reservationsFutures:
      type: integer
      minimum: 0
      description: réservations actives qui n'ont pas commencé, <n> de MSG-08
  examples:
    - {
        id: 1,
        nom: Atlas,
        capacite: 12,
        equipementIds: [1, 2],
        statut: active,
        reservationsFutures: 7
      }
SalleDemande:
  type: object
  additionalProperties: false
  description: déclaration ou modification d'une salle ; le statut ne se change pas ici
  required: [nom, capacite, equipementIds]
  properties:
    nom:
      {
        type: string,
        minLength: 1,
        maxLength: 60,
        description: 'espaces de bord retirés, MSG-U14 si vide'
      }
    capacite: {type: integer, minimum: 1, maximum: 200, description: MSG-U15 hors bornes}
    equipementIds:
      type: array
      uniqueItems: true
      items: {type: integer, minimum: 1}
  examples:
    - {nom: Cassiopée, capacite: 8, equipementIds: [1, 3]}
SalleDesactivee:
  type: object
  additionalProperties: false
  description: résultat de la désactivation, pour MSG-06
  required: [salleId, reservationsAnnulees]
  properties:
    salleId: {type: integer, minimum: 1}
    reservationsAnnulees: {type: integer, minimum: 0, description: '<n> de MSG-06'}
  examples:
    - {salleId: 1, reservationsAnnulees: 7}
Equipement:
  type: object
  additionalProperties: false
  x-entity: EN-04
  required: [id, code, libelle]
  properties:
    id: {type: integer, minimum: 1}
    code: {type: string, enum: [ecran, visio, tableau_blanc]}
    libelle: {type: string}
  examples:
    - {id: 1, code: ecran, libelle: Écran}
