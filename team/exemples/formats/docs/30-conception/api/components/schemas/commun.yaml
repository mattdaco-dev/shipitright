# Domaine « Commun » : schémas nommés dans openapi.yaml sous components/schemas

Jour:
  type: string
  format: date
  description: date AAAA-MM-JJ
  examples: ['2026-10-06']
Heure:
  type: string
  pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
  description: >-
    heure HH:MM. Le pas de 15 minutes et la plage 08:00-19:00 (RG-02) sont des règles, contrôlées en
    422 CRENEAU_HORS_REGLES, pas des formats.
  examples: ['10:00']
