# domain: Séries
# Schémas nommés dans openapi.yaml sous components/schemas

Frequence:
  type: string
  enum: [quotidienne, hebdomadaire, mensuelle]
  x-enum-releases: {mensuelle: R3}
  description: >-
    quotidienne = chaque jour ouvré ; hebdomadaire = même jour de la semaine (RG-04). mensuelle est
    annoncée pour la release R3, sa règle de dates reste à poser.
SerieDemande:
  type: object
  additionalProperties: false
  description: demande de série, telle que saisie sur EC-04
  required: [salleId, premierJour, debut, fin, frequence, jusquAu]
  properties:
    salleId: {type: integer, minimum: 1}
    premierJour: {$ref: 'commun.yaml#/Jour'}
    debut: {$ref: 'commun.yaml#/Heure'}
    fin: {$ref: 'commun.yaml#/Heure'}
    frequence: {$ref: '#/Frequence'}
    jusquAu: {$ref: 'commun.yaml#/Jour'}
  examples:
    - {
        salleId: 1,
        premierJour: '2026-10-06',
        debut: '10:00',
        fin: '11:00',
        frequence: hebdomadaire,
        jusquAu: '2026-12-29'
      }
SerieConfirmation:
  type: object
  additionalProperties: false
  description: les champs de SerieDemande, plus les jours confirmés (schéma à plat, comme SalleDetail)
  required: [salleId, premierJour, debut, fin, frequence, jusquAu, joursConfirmes]
  properties:
    salleId: {type: integer, minimum: 1}
    premierJour: {$ref: 'commun.yaml#/Jour'}
    debut: {$ref: 'commun.yaml#/Heure'}
    fin: {$ref: 'commun.yaml#/Heure'}
    frequence: {$ref: '#/Frequence'}
    jusquAu: {$ref: 'commun.yaml#/Jour'}
    joursConfirmes:
      type: array
      minItems: 1
      uniqueItems: true
      description: occurrences libres de l'aperçu que l'employé confirme
      items: {$ref: 'commun.yaml#/Jour'}
Occurrence:
  type: object
  additionalProperties: false
  required: [jour, statut]
  properties:
    jour: {$ref: 'commun.yaml#/Jour'}
    statut: {type: string, enum: [libre, conflit]}
SerieApercu:
  type: object
  additionalProperties: false
  description: occurrences calculées d'une série, rien n'est écrit
  required: [total, libres, conflits, occurrences]
  properties:
    total: {type: integer, minimum: 1, description: '<total> de MSG-04'}
    libres: {type: integer, minimum: 0}
    conflits: {type: integer, minimum: 0, description: '<n> de MSG-04'}
    occurrences:
      type: array
      description: dans l'ordre chronologique
      items: {$ref: '#/Occurrence'}
SerieCreee:
  type: object
  additionalProperties: false
  x-entity: EN-06
  required: [serieId, reservations, ignorees]
  properties:
    serieId: {type: integer, minimum: 1}
    reservations:
      type: array
      description: occurrences créées, dans l'ordre chronologique ; la première sert à MSG-02
      items: {$ref: 'reservations.yaml#/Reservation'}
    ignorees:
      type: array
      description: occurrences de la série non créées (en conflit à l'aperçu, ou libérées depuis)
      items: {$ref: 'commun.yaml#/Jour'}
SerieAnnulee:
  type: object
  additionalProperties: false
  required: [serieId, annulees]
  properties:
    serieId: {type: integer, minimum: 1}
    annulees: {type: integer, minimum: 0, description: occurrences passées au statut annulée}
  examples:
    - {serieId: 7, annulees: 9}
